# Mirror local para el laboratorio real: sirve copias de los paquetes
# espejables (compilador, interprete, librerias-base, gestor-paquetes) desde
# disco, sin salir nunca a origen. Sincronizar /var/www/mirror con esas
# copias ANTES de medir la sesión; ese tiempo de sincronización se reporta
# aparte (--sincronizacion-mirror-s en scripts/consolidar_sesion_laboratorio.py),
# no se mide por estación.
#
# imagen-contenedor NO va aquí (no es espejable: demostrador/services/origen.py
# lo marca espejable=False porque un mirror de repositorios no cubre imágenes
# de contenedor). Si se sirve algo con este nombre, no sale del modelo del
# artículo: colocarlo rompe la comparación con el modelo simulado.
server {
    listen 80;
    root /var/www/mirror;
    location / {
        add_header X-Cache-Status "MIRROR" always;   # informativo; el cliente no depende de esto
    }
}

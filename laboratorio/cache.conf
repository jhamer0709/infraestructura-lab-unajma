# Proxy de caché bajo demanda para el laboratorio real (no el ensayo con
# contenedores de experimento/). Corre en un host de la LAN, alcanzable por
# las estaciones. Reemplazar <ORIGEN_REAL> por la URL real del origen (el
# repositorio o mirror externo de verdad) antes de desplegar.
#
# X-Cache-Status es lo que scripts/estacion_laboratorio.py lee para saber si
# una petición realmente salió a origen (MISS, EXPIRED, STALE, UPDATING,
# REVALIDATED, BYPASS) o se sirvió de la caché (HIT). Sin esta cabecera el
# cliente no puede distinguirlo desde afuera.
proxy_cache_path /var/cache/nginx/laboratorio levels=1:2 keys_zone=laboratorio:50m max_size=5g inactive=7d;

server {
    listen 80;
    location / {
        proxy_pass http://<ORIGEN_REAL>;
        proxy_cache laboratorio;
        proxy_cache_lock on;       # pedidos simultáneos del mismo paquete esperan la primera descarga
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}

name: Pruebas

on:
  pull_request:
  push:
    branches: [main, release, dev]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Evidencia de pruebas (ISO 25010) actualizada
        run: python scripts/verificar_evidencia_pruebas.py
